name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build + lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 is Active LTS. Do NOT downgrade to 20 — it reached EOL
      # on 30 April 2026 and no longer receives security patches.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
